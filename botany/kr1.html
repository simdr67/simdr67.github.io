<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ботаника — тематический тест</title>
<style>
  :root {
    --green: #2e7d32;
    --green-dark: #1b5e20;
    --green-light: #e8f5e9;
    --green-mid: #c8e6c9;
    --red: #c62828;
    --red-light: #ffebee;
    --text: #1f2d1f;
    --muted: #5c6b5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background: linear-gradient(160deg, #f1f8e9 0%, #e3f2e4 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .app { max-width: 820px; margin: 0 auto; }
  .topbar { text-align: center; margin-bottom: 22px; }
  .topbar h1 { font-size: 1.45rem; margin: 0 0 6px; color: var(--green-dark); }
  .subtitle { margin: 0; color: var(--muted); font-size: 0.92rem; }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 10px 34px rgba(46,125,50,.10);
    animation: fade .3s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .hidden { display: none !important; }

  /* Стартовый экран */
  .start h2 { margin: 0 0 8px; color: var(--green-dark); font-size: 1.2rem; }
  .start p { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }

  /* Тумблер случайного порядка */
  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 20px;
    padding: 12px 16px;
    background: var(--green-light);
    border-radius: 12px;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .toggle-wrap:hover { background: #dcefdc; }
  .toggle-input { display: none; }
  .toggle-slider {
    position: relative;
    width: 44px;
    height: 24px;
    background: #b8ccb8;
    border-radius: 999px;
    transition: background .2s;
    flex-shrink: 0;
  }
  .toggle-slider::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    background: #fff;
    border-radius: 50%;
    transition: transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .toggle-input:checked + .toggle-slider { background: var(--green); }
  .toggle-input:checked + .toggle-slider::after { transform: translateX(20px); }
  .toggle-label { font-size: 0.92rem; font-weight: 600; color: var(--green-dark); }

  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .themes button {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 16px 18px;
    border: 2px solid var(--green-mid);
    background: #fff;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--green-dark);
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .themes button span {
    background: var(--green-light);
    color: var(--green-dark);
    font-size: 0.8rem;
    padding: 2px 9px;
    border-radius: 999px;
  }
  .themes button:hover { border-color: var(--green); background: var(--green-light); transform: translateY(-2px); }

  /* Прогресс */
  .progress-wrap { margin-bottom: 16px; }
  .progress {
    height: 9px;
    background: var(--green-mid);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #66bb6a, var(--green));
    border-radius: 999px;
    transition: width .35s ease;
  }
  .meta {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; color: var(--muted);
    margin-top: 8px;
  }

  /* Вопрос */
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--green-light);
    color: var(--green-dark);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: .3px;
    margin-bottom: 14px;
  }
  .question { font-size: 1.12rem; line-height: 1.45; margin: 0 0 8px; }

  .option {
    display: flex; gap: 12px; align-items: flex-start;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    margin-top: 10px;
    border: 2px solid var(--green-mid);
    border-radius: 12px;
    background: #fff;
    font-size: 0.98rem;
    line-height: 1.4;
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .option:hover:not(.locked) { border-color: var(--green); background: var(--green-light); transform: translateX(3px); }
  .option .letter { font-weight: 800; color: var(--green); min-width: 1.1em; }
  .option.locked { cursor: default; }
  .option.correct { border-color: var(--green); background: var(--green-light); }
  .option.correct .letter { color: var(--green-dark); }
  .option.wrong { border-color: var(--red); background: var(--red-light); }
  .option.wrong .letter { color: var(--red); }
  .option.locked:not(.correct):not(.wrong) { opacity: .5; }

  /* Подсказка */
  .explain {
    display: none;
    margin-top: 18px;
    padding: 16px 18px;
    border-left: 4px solid var(--green);
    background: #f6fbf5;
    border-radius: 10px;
    font-size: 0.94rem;
    line-height: 1.6;
  }
  .explain.show { display: block; animation: fade .3s ease; }
  .explain-title { font-weight: 800; margin-bottom: 6px; color: var(--green-dark); }
  .explain p { margin: 0; }
  .explain strong { color: var(--green-dark); }

  .next {
    display: none;
    margin-top: 22px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--green);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s;
  }
  .next.show { display: block; animation: fade .3s ease; }
  .next:hover { background: var(--green-dark); }

  /* Результат */
  .result { text-align: center; padding: 38px 24px; }
  .result h2 { margin: 0 0 6px; color: var(--green-dark); }
  .big-score { font-size: 3.4rem; font-weight: 800; color: var(--green); line-height: 1; margin: 10px 0 4px; }
  .pct { color: var(--muted); font-size: 1.05rem; margin: 0 0 18px; }
  .result p.msg { font-size: 1.02rem; line-height: 1.5; margin-bottom: 24px; }
  .result-buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .result-buttons .next { width: auto; padding: 12px 26px; margin: 0; display: inline-block; }
  .result-buttons .ghost {
    padding: 12px 26px;
    border: 2px solid var(--green);
    background: #fff;
    color: var(--green-dark);
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
  }
  .result-buttons .ghost:hover { background: var(--green-light); }

  @media (max-width: 560px) {
    .themes { grid-template-columns: 1fr; }
    .card { padding: 20px; }
    .topbar h1 { font-size: 1.2rem; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>🌿 Ботаника: клетка, ткани, органы</h1>
    <p class="subtitle">Тематический тренажёр с подробным разбором ответов</p>
  </header>

  <!-- Старт -->
  <section id="start" class="card start">
    <h2>Выбери тему</h2>
    <p>После каждого ответа появится развёрнутая подсказка — читай её, даже если ответил верно.</p>

    <label class="toggle-wrap" for="randomToggle">
      <input type="checkbox" id="randomToggle" class="toggle-input">
      <span class="toggle-slider"></span>
      <span class="toggle-label">🎲 Случайный порядок вопросов</span>
    </label>

    <div class="themes">
      <button data-section="all">🌿 Все темы <span>0</span></button>
      <button data-section="Клетка">🔬 Клетка <span>0</span></button>
      <button data-section="Ткани">🧶 Ткани <span>0</span></button>
      <button data-section="Органы">🌱 Органы <span>0</span></button>
    </div>
  </section>

  <!-- Тест -->
  <main id="quiz" class="hidden">
    <div class="progress-wrap">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="meta">
        <span id="counter"></span>
        <span id="scoreLabel">Правильно: 0</span>
      </div>
    </div>
    <div class="card">
      <div class="badge" id="sectionBadge"></div>
      <h2 class="question" id="questionText"></h2>
      <div id="options"></div>
      <div class="explain" id="explain"></div>
      <button class="next" id="nextBtn">Следующий вопрос →</button>
    </div>
  </main>

  <!-- Результат -->
  <section id="result" class="hidden card result"></section>
</div>

<script>
const questions = [
  // ==================== РАЗДЕЛ I. КЛЕТКА (13) ====================
  {
    section: "Клетка", topic: "Пластиды",
    q: "Какая органелла обеспечивает фотосинтез в растительной клетке?",
    options: ["Митохондрия", "Хлоропласт", "Лейкопласт", "Хромопласт"],
    correct: 1,
    explain: "<strong>Хлоропласт</strong> — двумембранная органелла с тилакоидами гран, содержащими хлорофилл. В тилакоидах идёт световая фаза фотосинтеза, в строме — темновая. Митохондрии обеспечивают дыхание и синтез АТФ, лейкопласты запасают вещества, хромопласты содержат каротиноиды и привлекают опылителей и агентов зоохории."
  },
  {
    section: "Клетка", topic: "Пластиды",
    q: "Лейкопласты, запасающие липиды, называются…",
    options: ["Амилопласты", "Элайопласты", "Протеопласты", "Хромопласты"],
    correct: 1,
    explain: "<strong>Элайопласты</strong> — лейкопласты, накапливающие липиды (масла). Амилопласты запасают вторичный крахмал, протеопласты — белки. Все типы пластид способны к онтогенетическим переходам друг в друга."
  },
  {
    section: "Клетка", topic: "Клеточная стенка",
    q: "Для клеток склеренхимы (волокон, склеренд) характерна…",
    options: ["Первичная тонкая оболочка", "Вторичная одревесневшая оболочка", "Отсутствие оболочки", "Только пектиновая оболочка"],
    correct: 1,
    explain: "<strong>Склеренхима</strong> — механическая ткань из мёртвых клеток с толстой слоистой вторичной оболочкой, пропитанной лигнином. Первичная оболочка тонкая (1–3 мкм), эластичная, содержит до 70% воды и характерна для меристем, паренхимы и колленхимы; она допускает рост клетки растяжением."
  },
  {
    section: "Клетка", topic: "Осмос",
    q: "Какой формулой выражается сосущая сила клетки?",
    options: ["S = P + T", "S = P – T", "S = T – P", "S = P × T"],
    correct: 1,
    explain: "<strong>S = P – T</strong>, где P — осмотическое давление клеточного сока, T — тургорное давление стенки. При полном тургоре T = P, поэтому S = 0 — клетка не всасывает воду. В начале плазмолиза T = 0, и S = P — сосущая сила максимальна."
  },
  {
    section: "Клетка", topic: "Включения",
    q: "Кристаллы оксалата кальция в виде игольчатых пучков называются…",
    options: ["Друзы", "Рафиды", "Стилоиды", "Кристаллический песок"],
    correct: 1,
    explain: "<strong>Рафиды</strong> — игольчатые кристаллы в пучках (ландыш, купена). Друзы — шаровидные звездчатые сростки (ревень, дурман, крушина). Стилоиды — крупные колончатые кристаллы (ирис). Кристаллический песок — масса микрокристаллов (красавка). Форма кристаллов — важнейший микродиагностический признак лекарственного сырья."
  },
  {
    section: "Клетка", topic: "Осмос",
    q: "Плазмолиз — это…",
    options: ["Разрыв клетки", "Отрыв протопласта от клеточной стенки", "Набухание клетки", "Растворение оболочки"],
    correct: 1,
    explain: "При погружении клетки в <strong>гипертонический раствор</strong> вода выходит из вакуоли, объём протопласта уменьшается, и он отходит от клеточной стенки — это плазмолиз. Процесс обратим: в воде наступает деплазмолиз. Тургор — противоположное состояние, когда стенка напряжена давлением клеточного сока."
  },
  {
    section: "Клетка", topic: "Органеллы",
    q: "Тонопласт — это мембрана, ограничивающая…",
    options: ["Ядро", "Центральную вакуоль", "Хлоропласт", "Митохондрию"],
    correct: 1,
    explain: "<strong>Тонопласт</strong> — одинарная мембрана центральной вакуоли. Плазмалемма — наружная мембрана клетки, кариолемма — оболочка ядра. В вакуоли находится клеточный сок: сахара, органические кислоты, гликозиды, алкалоиды, дубильные вещества, пигменты (антоцианы)."
  },
  // ----- НОВЫЕ: Клетка -----
  {
    section: "Клетка", topic: "Форма клеток",
    q: "Клетки, у которых длина во много раз превышает ширину, называются…",
    options: ["Паренхимные", "Прозенхимные", "Изодиаметрические", "Сферические"],
    correct: 1,
    explain: "<strong>Прозенхимные</strong> клетки — удлинённые, веретеновидные, длина во много раз превышает ширину (волокна, трахеиды, ситовидные трубки). Паренхимные (изодиаметрические) — отношение длины к ширине не более 1:3 (клетки паренхимы, эпидермы). Средний размер растительной клетки — 15–100 мкм; механические волокна могут достигать нескольких сантиметров."
  },
  {
    section: "Клетка", topic: "Ядро",
    q: "Что из перечисленного НЕ является компонентом ядра?",
    options: ["Кариолемма", "Хроматин", "Ядрышко", "Тонопласт"],
    correct: 3,
    explain: "<strong>Тонопласт</strong> — мембрана центральной вакуоли, к ядру отношения не имеет. Компоненты ядра: двухмембранная ядерная оболочка (кариолемма) с поровыми комплексами, кариоплазма (нуклеоплазма), хроматин (в нём локализована ДНК) и ядрышко (место сборки рРНК). Роль ядра — хранение, репарация, воспроизведение генетической информации и транскрипция."
  },
  {
    section: "Клетка", topic: "Митоз",

    correct: 1,
    explain: "У растений в клеточном центре нет центриолей, поэтому веретено деления <strong>ацентриолярное</strong>. Цитокинез идёт центробежно: из везикул аппарата Гольджи в центре клетки собирается фрагмопласт, и образуется срединная пластинка, растущая от центра к периферии. Фазы митоза — профаза, метафаза, анафаза, телофаза."

  {
    section: "Клетка", topic: "Реактивы",

    explain: "Одревеснение (лигнификация) — пропитка оболочки лигнином. Реакция с <strong>флороглюцином и концентрированной HCl</strong> даёт вишнёво-красное окрашивание, с сульфатом анилина — золотисто-жёлтое. Судан III используют для суберина и кутина, раствор Люголя — для крахмала, метиленовый синий — для слизей."
  },
  {
    section: "Клетка", topic: "Реактивы",
    q: "Опробковение (суберинизация) клеточной стенки окрашивается…",

  {
    section: "Клетка", topic: "Клеточный сок",

    options: ["Сахара", "Алкалоиды", "Антоцианы", "Хлорофилл"],
    correct: 3,
    explain: "<strong>Хлорофилл</strong> локализован в тилакоидах хлоропластов, в клеточном соке его нет. Клеточный сок — водный раствор первичных и вторичных метаболитов: сахаров, органических кислот, гликозидов, алкалоидов, дубильных веществ, пигментов (антоцианы, антохлоры), минеральных солей. Функции вакуоли: осморегуляция, тургор, резервуар воды, изоляция токсичных веществ."

    explain: "<strong>Вторичные меристемы</strong> закладываются после первичного роста. Камбий даёт вторичную ксилему и флоэму, феллоген — перидерму (пробку). К первичным меристемам относят промеристему, протодерму, прокамбий и основную меристему."

  {

  },
  {
    section: "Ткани", topic: "Устьица",

// Счётчики на кнопках тем
document.querySelectorAll('[data-section]').forEach(btn => {
  const s = btn.dataset.section;
  const n = s === 'all' ? questions.length : questions.filter(q => q.section === s).length;
  btn.querySelector('span').textContent = n;
  btn.addEventListener('click', () => start(s));
});

// Перемешивание (Фишер–Йетс)
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function start(section) {
  currentSection = section;
  active = section === 'all' ? [...questions] : questions.filter(q => q.section === section);
  if (els.randomToggle.checked) {
    shuffle(active);
  }
  idx = 0;
  score = 0;
  answered = false;
  els.start.classList.add('hidden');
  els.result.classList.add('hidden');
  els.quiz.classList.remove('hidden');
  els.scoreLabel.textContent = 'Правильно: 0';
  render();
}

function render() {
  const q = active[idx];
  answered = false;
  els.badge.textContent = q.section + ' • ' + q.topic;
  els.questionText.textContent = q.q;
  els.options.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = '<span class="letter">' + 'АБВГ'[i] + '</span><span>' + opt + '</span>';
    btn.addEventListener('click', () => select(i));
    els.options.appendChild(btn);
  });
  els.explain.classList.remove('show');
  els.explain.innerHTML = '';
  els.nextBtn.classList.remove('show');
  els.nextBtn.textContent = idx === active.length - 1 ? 'Показать результат →' : 'Следующий вопрос →';
  els.counter.textContent = 'Вопрос ' + (idx + 1) + ' из ' + active.length;
  updateBar();
}

function select(chosen) {
  if (answered) return;
  answered = true;
  const q = active[idx];
  const buttons = els.options.querySelectorAll('.option');
  buttons.forEach((b, j) => {
    b.classList.add('locked');
    if (j === q.correct) b.classList.add('correct');
    else if (j === chosen) b.classList.add('wrong');
  });
  const isRight = chosen === q.correct;
  if (isRight) {
    score++;
    els.scoreLabel.textContent = 'Правильно: ' + score;
  }
  els.explain.innerHTML =
    '<div class="explain-title">' + (isRight ? '✅ Верно!' : '❌ Не совсем') + '</div>' +
    '<p>' + q.explain + '</p>';
  els.explain.classList.add('show');
  els.nextBtn.classList.add('show');
  updateBar();
}

function updateBar() {
  const done = answered ? idx + 1 : idx;
  els.bar.style.width = (done / active.length * 100) + '%';
}

els.nextBtn.addEventListener('click', () => {
  idx++;
  if (idx >= active.length) showResult();
  else render();
});

function showResult() {
  els.quiz.classList.add('hidden');
  els.result.classList.remove('hidden');
  const pct = Math.round(score / active.length * 100);
  let msg;
  if (pct >= 90) msg = 'Отлично! Ты уверенно владеешь материалом 🌟';
  else if (pct >= 70) msg = 'Хорошо! Осталось подтянуть детали 💪';
  else if (pct >= 50) msg = 'Неплохо, но стоит повторить ключевые темы 📖';
  else msg = 'Пока слабовато — вернись к приоритетным вопросам 🌱';
  els.result.innerHTML =
    '<h2>Результат</h2>' +
    '<div class="big-score">' + score + ' / ' + active.length + '</div>' +
    '<p class="pct">' + pct + '%</p>' +
    '<p class="msg">' + msg + '</p>' +
    '<div class="result-buttons">' +
      '<button class="next show" id="retry">Пройти заново</button>' +
      '<button class="ghost" id="changeTheme">Выбрать другую тему</button>' +
    '</div>';
  document.getElementById('retry').addEventListener('click', () => start(currentSection));
  document.getElementById('changeTheme').addEventListener('click', () => {
    els.result.classList.add('hidden');
    els.start.classList.remove('hidden');
  });
}
</script>
</body>
</html>
