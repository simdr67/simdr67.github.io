<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Викторина: Итоговый коллоквиум (Усложненная)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .quiz-container, .start-screen {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);

            padding: 35px;

        .start-screen {
            text-align: center;
            display: block;
        }
        .quiz-container {
            display: none;
        }
        h1 {
            color: #1a252f;
            margin-bottom: 10px;
        }
        h2 {
            color: #2980b9;
            margin-top: 0;
            font-size: 1.3em;
            line-height: 1.4;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }
        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            padding: 15px 20px;
            font-size: 1em;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.5;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #e9ecef;
            border-color: #adb5bd;
        }
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        .correct-answer {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
            font-weight: 600;
        }
        .wrong-answer {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        .feedback {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            display: none;
            border-left: 6px solid #2980b9;
            background-color: #eaf2f8;
            line-height: 1.6;
        }
        .feedback h3 {
            margin-top: 0;
            color: #2980b9;
            font-size: 1.1em;
        }
        .feedback .fact {
            margin-top: 15px;
            font-style: italic;
            color: #34495e;
            border-top: 1px solid #bdc3c7;
            padding-top: 15px;
            font-size: 0.95em;
        }
        .next-btn, .start-btn {
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px 30px;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 25px;
            width: 100%;
            transition: background 0.3s;
            font-weight: 600;
        }
        .next-btn {
            background-color: #2980b9;
            display: none;
        }
        .next-btn:hover { background-color: #21618c; }
        .start-btn {
            background-color: #27ae60;
            font-size: 1.2em;
        }
        .start-btn:hover { background-color: #219653; }
        .progress {
            display: flex;
            justify-content: space-between;
            color: #7f8c8d;
            font-size: 0.9em;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-screen {
            text-align: center;
            display: none;
        }
        .score-screen h2 {
            font-size: 2.5em;
            color: #27ae60;
            margin-bottom: 10px;
        }
        .score-screen p {
            font-size: 1.2em;
            margin: 10px 0;

</head>
<body>

    <div class="start-screen" id="start-screen">
        <h1>Итоговый коллоквиум</h1>
        <p style="font-size: 1.1em; color: #555;">Тест состоит из 10 ситуационных и сложных вопросов, выбранных случайным образом из банка на 48 заданий. <br><br>Проверьте, готовы ли вы к вопросам преподавателя.</p>
        <button class="start-btn" onclick="startQuiz()">Начать испытание</button>
    </div>

    <div class="quiz-container" id="quiz-container">
        <div class="progress">
            <span id="progress-text">Вопрос 1 из 10</span>
            <span id="score-text">Счет: 0</span>
        </div>
        <h2 id="question-text">Текст вопроса</h2>
        <div class="options" id="options-container"></div>
        
        <div class="feedback" id="feedback-box">
            <h3 id="feedback-title">Верно!</h3>
            <p id="feedback-explanation"></p>
            <div class="fact" id="feedback-fact"></div>
        </div>
        
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Следующий вопрос</button>
    </div>

    <div class="quiz-container score-screen" id="score-screen">
        <h2>Результат</h2>
        <p>Вы ответили правильно на <strong><span id="final-score"></span> из 10</strong> вопросов.</p>
        <p id="score-message" style="font-weight: bold;"></p>
        <button class="start-btn" onclick="location.reload()">Пройти еще раз</button>
    </div>

    <script>
        // БАНК ЗАДАНИЙ (48 вопросов повышенной сложности)
        const questionBank = [
            {
                question: "Вы проводите оценку воздуха в асептическом блоке аптеки до начала работы. Какой метод отбора проб и какие нормативы будут строго обязательными для соблюдения СанПиН?",
                options: [
                    "Седиментационный метод, ОМЧ не более 1500 КОЕ/м³, S. aureus отсутствует",
                    "Аспирационный метод (аппарат Кротова), ОМЧ не более 500 КОЕ/м³, S. aureus и грибы отсутствуют",
                    "Только фильтрация воздуха, ОМЧ не более 100 КОЕ/м³, допускается 10 грибов",
                    "Седиментационный метод, ОМЧ не более 1000 КОЕ/м³, допускается S. aureus до 100 КОЕ/м³"

                correct: 1,
                explanation: "В асептическом блоке до работы ОМЧ должно быть не более 500 КОЕ/м³. S. aureus и плесневые/дрожжевые грибы не допускаются. Седиментационный метод (метод Коха) является ориентировочным, точные нормативы проверяются только аспирационным методом.",
                fact: "В зале обслуживания аптеки во время работы допускается ОМЧ до 1500 КОЕ/м³ и до 100 КОЕ/м³ золотистого стафилококка."
            },
            {
                question: "При исследовании воды из открытого водоема вы обнаружили темно-красные колонии с металлическим блеском на среде Эндо после мембранной фильтрации. Каков следующий шаг для подтверждения термотолерантных колиформных бактерий (ТКБ)?",
                options: [
                    "Посеять колонии на желточно-солевой агар",
                    "Поставить реакцию плазмокоагуляции",
                    "Проверить способность ферментировать лактозу при 44,5°C с образованием газа",
                    "Окрасить по Граму и проверить наличие оксидазы"
                ],
                correct: 2,
                explanation: "Колиформные бактерии (ОКБ) ферментируют лактозу при 37°C. Для выявления именно термотолерантных (ТКБ, индикаторов свежего фекального загрязнения) проверяют способность к газообразованию при 44,5°C.",
                fact: "Обнаружение ТКБ в 100 мл питьевой воды является грубым нарушением СанПиН и сигналом о возможном наличии возбудителей кишечных инфекций (брюшного тифа, дизентерии)."
            },
            {

                    "0,45 мкм",
                    "0,22 мкм",
                    "0,1 мкм",

                fact: "Фильтры с порами 0,45 мкм чаще используются в санитарной микробиологии (например, для воды), так как они задерживают колиформные бактерии, но для строгой стерилизации фармпрепаратов этого недостаточно."

            {

            {

                    "Бактерии не допускаются, грибы до 1000",

            {
                question: "При исследовании шкуры животного, павшего от неизвестной болезни, вам нужно исключить сибирскую язву. Материал старый и сильно загнивший. Какой метод позволит обнаружить антигены возбудителя, несмотря на гниение?",

                correct: 1,
                explanation: "Гнилостные микроорганизмы быстро уничтожают вегетативные клетки B. anthracis. Однако соматический полисахаридный антиген остается стабильным. Реакция Асколи (термопреципитация) выявляет этот термостабильный антиген в extracts.",

                correct: 1,
                explanation: "S. pyogenes вызывает полный β-гемолиз на кровяном агаре и высокочувствителен к бацитрацину. S. aureus дает положительную лицитовителлазную реакцию (на ЖСА) и образует фермент плазмокоагулазу, который свертывает плазму.",

            {
                question: "Какая особенность Clostridium perfringens позволяет быстро дифференцировать его от других клостридий при посеве на лакмусовое молоко?",

                correct: 2,

        let quizQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        const totalQuestions = 10; // Усложненный тест из 10 вопросов

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz() {
            // Выбираем 10 случайных вопросов из банка
            quizQuestions = shuffleArray([...questionBank]).slice(0, totalQuestions);
            
            // Перемешиваем варианты ответов внутри каждого вопроса
            quizQuestions = quizQuestions.map(q => {
                const shuffledOptions = shuffleArray(q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.correct })));
                return {
                    ...q,
                    shuffledOptions: shuffledOptions,
                    correctAnswerText: q.options[q.correct]
                };
            });

            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('score-text').innerText = `Счет: 0`;
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizQuestions[currentQuestionIndex];
            document.getElementById('progress-text').innerText = `Вопрос ${currentQuestionIndex + 1} из ${totalQuestions}`;
            document.getElementById('question-text').innerText = q.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.style.display = 'none';
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = 'none';

            q.shuffledOptions.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option.text;
                btn.onclick = () => selectOption(btn, option.isCorrect, q);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, isCorrect, q) {
            const optionsContainer = document.getElementById('options-container');
            const allButtons = optionsContainer.querySelectorAll('.option-btn');
            
            allButtons.forEach(btn => btn.disabled = true);

            const feedbackBox = document.getElementById('feedback-box');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackExplanation = document.getElementById('feedback-explanation');
            const feedbackFact = document.getElementById('feedback-fact');

            if (isCorrect) {
                selectedBtn.classList.add('correct-answer');
                feedbackTitle.innerText = "✅ Верно!";
                feedbackTitle.style.color = "#28a745";
                score++;
                document.getElementById('score-text').innerText = `Счет: ${score}`;
            } else {
                selectedBtn.classList.add('wrong-answer');
                feedbackTitle.innerText = "❌ Неверно.";
                feedbackTitle.style.color = "#dc3545";
                
                allButtons.forEach(btn => {
                    if (btn.innerText === q.correctAnswerText) {
                        btn.classList.add('correct-answer');
                    }
                });
            }

            feedbackExplanation.innerHTML = `<strong>Правильный ответ:</strong> ${q.correctAnswerText}<br><br>${q.explanation}`;
            feedbackFact.innerHTML = `<strong>💡 Для углубления знаний:</strong> ${q.fact}`;
            
            feedbackBox.style.display = 'block';
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.style.display = 'block';
            if (currentQuestionIndex === totalQuestions - 1) {
                nextBtn.innerText = "Показать результаты";
            } else {
                nextBtn.innerText = "Следующий вопрос";
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < totalQuestions) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-container').style.display = 'none';
            const scoreScreen = document.getElementById('score-screen');
            scoreScreen.style.display = 'block';
            document.getElementById('final-score').innerText = score;
            
            const message = document.getElementById('score-message');
            if (score === 10) {
                message.innerText = "Безупречно! Вы готовы сдать коллоквиум на отлично.";
                message.style.color = "#27ae60";
            } else if (score >= 8) {
                message.innerText = "Отличный результат! Вы хорошо усвоили материал.";
                message.style.color = "#2980b9";
            } else if (score >= 6) {
                message.innerText = "Хорошо, но есть пробелы. Обратите внимание на объяснения неверных ответов.";
                message.style.color = "#f39c12";
            } else {
                message.innerText = "Стоит повторить конспекты и попробовать снова.";
                message.style.color = "#c0392b";
            }
        }
