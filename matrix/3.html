<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тест: Мутации и регуляция генов</title>
<style>
  :root {
    --bg: #f4f7fb; --card: #ffffff; --primary: #3b6ea5; --primary-dark: #2c527a;
    --border: #d7e2ee; --text: #22303f; --muted: #6b7c8f;
    --correct: #2e9e5b; --wrong: #d64545; --warn: #e0a800;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.5; -webkit-tap-highlight-color: transparent; }
  .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 24px; margin: 0 0 8px; color: var(--primary-dark); }
  header p { margin: 0; color: var(--muted); font-size: 0.9em; }
  
  .progress-bar { position: sticky; top: 0; z-index: 10;
    background: rgba(244, 247, 251, 0.95); backdrop-filter: blur(6px);
    padding: 10px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .progress-inner { max-width: 860px; margin: 0 auto; padding: 0 16px;
    display: flex; align-items: center; gap: 12px; }
  .progress-track { flex: 1; height: 8px; background: #e2eaf3; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s ease; }
  .progress-label { font-size: 13px; color: var(--muted); white-space: nowrap; }
  
  .question-card { background: var(--card); border-radius: 12px; padding: 20px 22px; margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(34, 48, 63, 0.06); border: 1px solid var(--border); }
  .question-card.correct-card { border-left: 4px solid var(--correct); }
  .question-card.wrong-card { border-left: 4px solid var(--wrong); }
  .q-header { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px; }
  .q-num { background: var(--primary); color: #fff; font-weight: 700; font-size: 13px;
    border-radius: 6px; padding: 2px 9px; flex-shrink: 0; margin-top: 2px; }
  .q-text { font-weight: 600; font-size: 16px; }
  
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px;
    border-radius: 8px; border: 1px solid var(--border); cursor: pointer;
    transition: background 0.15s, border-color 0.15s; user-select: none; }
  .option:hover { background: #f0f5fb; }
  .option input { margin-top: 3px; accent-color: var(--primary); flex-shrink: 0; transform: scale(1.2); }
  .option.selected { border-color: var(--primary); background: #e8f1fa; }
  .option.correct-opt { border-color: var(--correct); background: #e9f7ef; }
  .option.wrong-opt { border-color: var(--wrong); background: #fdeaea; }
  .opt-key { font-weight: 700; color: var(--primary-dark); flex-shrink: 0; }
  
  /* Стили для соответствий */
  .matching { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .match-row { display: flex; gap: 10px; align-items: center; background: #f7fafd;
    border-radius: 8px; padding: 8px 10px; border: 1px solid var(--border); }
  .match-left { flex: 1; font-size: 14px; }
  .match-left .key { font-weight: 700; color: var(--primary-dark); margin-right: 4px; }
  .drop-zone { width: 80px; min-height: 42px; border: 2px dashed #b9cde0; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; background: #fff;
    transition: border-color 0.15s, background 0.15s; flex-shrink: 0; cursor: pointer; }
  .drop-zone.filled { border-style: solid; border-color: var(--primary); background: #eaf2fb; }
  
  .chip-pool { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px;
    background: #f0f5fb; border-radius: 8px; border: 1px dashed #c4d6e7; min-height: 52px; }
  .chip { background: #fff; border: 1px solid #b9cde0; border-radius: 8px; padding: 8px 12px;
    font-size: 14px; cursor: pointer; display: flex; gap: 6px; align-items: center;
    max-width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,0.04); transition: all 0.2s; user-select: none; }
  .chip.selected { border-color: var(--warn); background: #fdf6e3; box-shadow: 0 0 8px rgba(224, 168, 0, 0.4); }
  .chip .chip-key { font-weight: 700; color: var(--primary-dark); }
  .drop-zone .chip { margin: 0; padding: 4px 8px; font-size: 13px; }
  .drop-zone .chip .chip-text { display: none; }
  
  .btn { display: inline-block; background: var(--primary); color: #fff; border: none; border-radius: 10px;
    padding: 16px 28px; font-size: 16px; font-weight: 600; cursor: pointer;
    transition: background 0.15s; width: 100%; margin-top: 10px; }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { background: #a9bdd2; cursor: not-allowed; }
  
  .result-section { margin-top: 28px; background: var(--card); border-radius: 12px; padding: 22px;
    border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(34, 48, 63, 0.06); }
  .score-box { text-align: center; padding: 16px; border-radius: 10px; margin-bottom: 18px;
    font-size: 22px; font-weight: 700; }
  .score-good { background: #e9f7ef; color: var(--correct); }
  .score-mid { background: #fdf6e3; color: var(--warn); }
  .score-bad { background: #fdeaea; color: var(--wrong); }
  .result-item { border-top: 1px solid var(--border); padding: 14px 0; }
  .result-item:first-child { border-top: none; }
  .result-q { font-weight: 600; margin-bottom: 6px; font-size: 15px; }
  .result-line { font-size: 14px; margin: 3px 0; }
  .result-line .label { color: var(--muted); }
  .result-correct { color: var(--correct); font-weight: 600; }
  .result-wrong { color: var(--wrong); font-weight: 600; }
  .result-ok { color: var(--correct); font-weight: 700; }
</style>
</head>
<body>

<div class="progress-bar">
  <div class="progress-inner">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  </div>

      {key: 'б', text: 'Обладает субстратной специфичностью к галактозе'},
      {key: 'в', text: 'Участвует в «созревании» эритроцитов, не имеющих на мембране антигенов'},
      {key: 'г', text: 'Катализирует гликозилирование мембранного белка по Асн'}
    ],
    correct: {'1': 'а', '2': 'б', '3': 'в'}
  }
];

/* ==================== ВЫБОРКА 15 ВОПРОСОВ ==================== */

function pickRandom(arr, n) {
  const copy = arr.slice();
  const out = [];
  for (let i = 0; i < n && copy.length > 0; i++) {
    const idx = Math.floor(Math.random() * copy.length);
    out.push(copy.splice(idx, 1)[0]);
  }
  return out;
}

// Выбираем 12 вопросов с выбором ответа и 3 на соответствие
const selectedChoices = pickRandom(choicePool, 12);
const selectedMatchings = pickRandom(matchingPool, 3);
let questions = [...selectedChoices, ...selectedMatchings];
questions = questions.sort(() => Math.random() - 0.5);

/* ==================== РЕНДЕР ==================== */

const form = document.getElementById('quizForm');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const submitBtn = document.getElementById('submitBtn');
const resetBtn = document.getElementById('resetBtn');
const resultArea = document.getElementById('resultArea');

function renderQuestion(q, index) {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.dataset.qid = q.id;
  card.dataset.qtype = q.type;

  const header = document.createElement('div');
  header.className = 'q-header';

  const num = document.createElement('div');
  num.className = 'q-num';
  num.textContent = 'Вопрос ' + (index + 1);

  const textWrap = document.createElement('div');
  textWrap.className = 'q-text';
  textWrap.textContent = q.question;

  header.appendChild(num);
  header.appendChild(textWrap);
  card.appendChild(header);

  if (q.type === 'choice') {
    const opts = document.createElement('div');
    opts.className = 'options';
    q.options.forEach(opt => {
      const label = document.createElement('label');
      label.className = 'option';
      label.dataset.key = opt.key;

      const input = document.createElement('input');
      input.type = 'checkbox'; // Только чекбоксы
      input.name = 'q_' + q.id + '_' + index;
      input.value = opt.key;
      
      input.addEventListener('change', () => {
        label.classList.toggle('selected', input.checked);
        updateProgress();
      });
      
      label.appendChild(input);

      const keySpan = document.createElement('span');
      keySpan.className = 'opt-key';
      keySpan.textContent = opt.key + ')';
      label.appendChild(keySpan);

      const txt = document.createElement('span');
      txt.textContent = opt.text;
      label.appendChild(txt);

      opts.appendChild(label);
    });
    card.appendChild(opts);
  } else if (q.type === 'matching') {
    const matching = document.createElement('div');
    matching.className = 'matching';

    q.left.forEach(leftItem => {
      const row = document.createElement('div');
      row.className = 'match-row';

      const leftDiv = document.createElement('div');
      leftDiv.className = 'match-left';
      const k = document.createElement('span');
      k.className = 'key';
      k.textContent = leftItem.key + '.';
      leftDiv.appendChild(k);
      leftDiv.appendChild(document.createTextNode(' ' + leftItem.text));
      row.appendChild(leftDiv);

      const zone = document.createElement('div');
      zone.className = 'drop-zone';
      zone.dataset.left = leftItem.key;
      row.appendChild(zone);

      matching.appendChild(row);
    });

    card.appendChild(matching);

    const pool = document.createElement('div');
    pool.className = 'chip-pool';
    q.right.forEach(rightItem => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.dataset.key = rightItem.key;

      const ck = document.createElement('span');
      ck.className = 'chip-key';
      ck.textContent = rightItem.key + ')';
      chip.appendChild(ck);

      const ct = document.createElement('span');
      ct.className = 'chip-text';
      ct.textContent = rightItem.text;
      chip.appendChild(ct);

      pool.appendChild(chip);
    });
    card.appendChild(pool);
  }

  form.appendChild(card);
  return card;
}

questions.forEach((q, i) => renderQuestion(q, i));

/* ==================== МОБИЛЬНАЯ МЕХАНИКА ДЛЯ СООТВЕТСТВИЙ ==================== */

let selectedChip = null;

function setupMobileMatching(card) {
  const pool = card.querySelector('.chip-pool');
  const zones = card.querySelectorAll('.drop-zone');
  const chips = card.querySelectorAll('.chip');

  chips.forEach(chip => {
    chip.addEventListener('click', (e) => {
      e.stopPropagation();
      
      if (chip.parentElement.classList.contains('drop-zone')) {
        pool.appendChild(chip);
        chip.parentElement.classList.remove('filled');
        updateProgress();
        return;
      }

      if (selectedChip) {
        selectedChip.classList.remove('selected');
      }
      selectedChip = chip;
      selectedChip.classList.add('selected');
    });
  });

  zones.forEach(zone => {
    zone.addEventListener('click', () => {
      if (!selectedChip) return;
      
      const existingChip = zone.querySelector('.chip');
      if (existingChip) {
        pool.appendChild(existingChip);
      }
      
      zone.appendChild(selectedChip);
      zone.classList.add('filled');
      selectedChip.classList.remove('selected');
      selectedChip = null;
      updateProgress();
    });
  });

  pool.addEventListener('click', (e) => {
    if (e.target === pool && selectedChip) {
      selectedChip.classList.remove('selected');
      selectedChip = null;
    }
  });
}

document.querySelectorAll('.question-card').forEach(card => {
  if (card.dataset.qtype === 'matching') setupMobileMatching(card);
});

/* ==================== ПРОГРЕСС ==================== */

function isQuestionAnswered(card) {
  const type = card.dataset.qtype;
  if (type === 'choice') {
    return !!card.querySelector('input:checked');
  } else {
    const zones = card.querySelectorAll('.drop-zone');
    for (const z of zones) {
      if (!z.querySelector('.chip')) return false;
    }
    return true;
  }
}

function updateProgress() {
  const cards = document.querySelectorAll('.question-card');
  let answered = 0;
  cards.forEach(c => { if (isQuestionAnswered(c)) answered++; });
  const total = cards.length;
  progressFill.style.width = (answered / total * 100) + '%';
  progressLabel.textContent = answered + ' / ' + total;
}

updateProgress();

/* ==================== ПРОВЕРКА ==================== */

function getCorrectText(q) {
  if (q.type === 'choice') {
    return q.correct.join(', ');
  } else {
    return Object.keys(q.correct).map(l => l + '–' + q.correct[l]).join('; ');
  }
}

function getUserAnswerText(card, q) {
  if (q.type === 'choice') {
    const checked = card.querySelectorAll('input:checked');
    const vals = Array.from(checked).map(i => i.value);
    return vals.length ? vals.sort().join(', ') : '—';
  } else {
    const pairs = [];
    let any = false;
    card.querySelectorAll('.drop-zone').forEach(z => {
      const chip = z.querySelector('.chip');
      if (chip) {
        pairs.push(z.dataset.left + '–' + chip.dataset.key);
        any = true;
      } else {
        pairs.push(z.dataset.left + '–?');
      }
    });
    return any ? pairs.join('; ') : '—';
  }
}

function checkQuestion(card, q) {
  if (q.type === 'choice') {
    const checked = card.querySelectorAll('input:checked');
    const vals = Array.from(checked).map(i => i.value).sort();
    const correctSorted = q.correct.slice().sort();
    return JSON.stringify(vals) === JSON.stringify(correctSorted);
  } else {
    for (const leftKey of Object.keys(q.correct)) {
      const zone = card.querySelector('.drop-zone[data-left="' + leftKey + '"]');
      const chip = zone ? zone.querySelector('.chip') : null;
      const chipKey = chip ? chip.dataset.key : null;
      if (chipKey !== q.correct[leftKey]) return false;
    }
    return true;
  }
}

function markQuestion(card, q, isCorrect) {
  card.classList.add(isCorrect ? 'correct-card' : 'wrong-card');

  if (q.type === 'choice') {
    card.querySelectorAll('.option').forEach(label => {
      const key = label.dataset.key;
      const input = label.querySelector('input');
      const isCorrectOpt = q.correct.includes(key);
      if (isCorrectOpt) label.classList.add('correct-opt');
      if (input.checked && !isCorrectOpt) label.classList.add('wrong-opt');
    });
  } else {
    card.querySelectorAll('.drop-zone').forEach(zone => {
      const leftKey = zone.dataset.left;
      const correctKey = q.correct[leftKey];
      const chip = zone.querySelector('.chip');
      const chipKey = chip ? chip.dataset.key : null;
      if (chipKey !== correctKey) {
        zone.style.borderColor = 'var(--wrong)';
        zone.style.background = '#fdeaea';
      } else {
        zone.style.borderColor = 'var(--correct)';
        zone.style.background = '#e9f7ef';
      }
    });
  }
}

submitBtn.addEventListener('click', () => {
  const cards = document.querySelectorAll('.question-card');
  let correctCount = 0;
  let wrongCount = 0;

  cards.forEach(card => {
    const q = questions.find(x => x.id == card.dataset.qid);
    const isCorrect = checkQuestion(card, q);
    if (isCorrect) correctCount++; else wrongCount++;
    markQuestion(card, q, isCorrect);
  });

  const total = cards.length;
  const score = Math.round(((correctCount - wrongCount) / total) * 100);

  let scoreClass = 'score-bad';
  if (score >= 50) scoreClass = 'score-good';
  else if (score >= 0) scoreClass = 'score-mid';

  let html = '<div class="result-section">';
  html += '<div class="score-box ' + scoreClass + '">Итог: ' + score + ' баллов</div>';
  html += '<p style="text-align:center;color:var(--muted);margin-top:-8px;">Правильно: ' + correctCount + ' · Неправильно/без ответа: ' + wrongCount + '</p>';

  cards.forEach((card, idx) => {
    const q = questions.find(x => x.id == card.dataset.qid);
    const isCorrect = checkQuestion(card, q);
    const userAns = getUserAnswerText(card, q);
    const correctAns = getCorrectText(q);

    html += '<div class="result-item">';
    html += '<div class="result-q">' + (idx + 1) + '. ' + q.question + '</div>';
    html += '<div class="result-line"><span class="label">Ваш ответ:</span> <span class="' + (isCorrect ? 'result-correct' : 'result-wrong') + '">' + userAns + '</span></div>';
    if (!isCorrect) {
      html += '<div class="result-line"><span class="label">Правильный ответ:</span> <span class="result-correct">' + correctAns + '</span></div>';
    } else {
      html += '<div class="result-line"><span class="result-ok">✓ Верно</span></div>';
    }
    html += '</div>';
  });

  html += '</div>';
  resultArea.innerHTML = html;
  resultArea.scrollIntoView({behavior: 'smooth', block: 'start'});

  submitBtn.disabled = true;
  submitBtn.textContent = 'Ответы проверены';
});

resetBtn.addEventListener('click', () => {
  window.location.reload();
});
</script>
</body>
